name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  HACKIOS_REPO: https://github.com/oosexgang/hackios-xnu-kernel
  # the hackios (device-model) tree this port is built against
  HACKIOS_REF: 7867dc1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: apt packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl xz-utils make flex bison m4 perl \
            python3 python3-pip python3-venv autoconf automake libtool \
            pkg-config clang lld llvm nasm zip uuid-dev libncurses-dev

      - name: theos (the cctools ld64 and the iPhoneOS 16.5 SDK)
        run: |
          git clone -q https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/toolchain/linux/iphone"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$HOME/theos/toolchain/linux/iphone" --strip-components=2
          "$HOME/theos/toolchain/linux/iphone/bin/ld" -v | head -1
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks" && mv /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"

      - name: hackios (upstream clone) + this device
        run: |
          git clone -q "$HACKIOS_REPO" hackios
          git -C hackios checkout -q "$HACKIOS_REF"
          git -C hackios apply --whitespace=nowarn ../patches/kernel-common.patch
          rm -rf hackios/devices/dodge && mkdir -p hackios/devices/dodge
          find . -mindepth 1 -maxdepth 1 -not -name hackios -exec cp -r {} hackios/devices/dodge/ \;
          rm -rf hackios/devices/dodge/.git

      - name: kernel (Apple XNU + the A830 GPU + this phone's drivers)
        run: |
          cd hackios
          export LC_ALL=C
          python3 tools/boot-args.py --lst > configs/boot-args.lst
          python3 tools/boot-args.py --markdown > docs/boot-args.md
          python3 tools/boot-args.py --symbols > configs/symbols.tsv
          make dodge_defconfig
          make kernel -j"$(nproc)"
          cp hakios-kernel ../kernel.bin

      - name: loader
        run: |
          python3 -m pip install --user --break-system-packages lzfse 2>/dev/null || python3 -m pip install --user lzfse
          cd hackios && make loader-open && cp xnuloader/loader.efi ../loader.efi    # the placeholder identity: no IPSW on the runner

      - uses: actions/upload-artifact@v4
        with:
          name: dodge-hakios
          path: |
            kernel.bin
            loader.efi
