# devices/dodge/device.conf: what this device repository is. tools/hakios-device.py reads it; docs/porting/repositories.md has
# every word. The device's page in the documentation is made from it, so the status is said in one place.

device dodge
	title       OnePlus 13 (dodge)
	vendor      OnePlus
	soc         sun
	defconfig   dodge_defconfig
	firmware    pull-firmware.sh
	maintainer  wuxianlin
	status      display     partial   UEFI's framebuffer through the loader; a run reaches SpringBoard. No GPU under this kernel yet
	status      touch       works     Synaptics S3910 on bit-banged GPIO SPI, TouchCom: multitouch, edge gestures, 125 Hz (CONFIG_HAKIOS_DODGE_TOUCH, synaptics=1)
	status      buttons     works     power from the PON, volume down from PM8550VS GPIO6 through the v7 arbiter's write side, volume up is resin (CONFIG_HAKIOS_BUTTONS, buttons_pin=0x18d buttons_swap=1)
	status      cpu         partial   four cores by default (cpus=4, the proven boot); all eight have been booted (cpus=8) but are not this configuration's
	status      audio       partial   the audio DSP's PAS bring-up steps run, with the SM8750's second signed image (its device tree) first: staged arguments in configs/dodge.config; no sound out yet
	status      wifi        partial   the WCN7850's PCIe in stages: a read-only probe in this configuration (CONFIG_HAKIOS_WCN, wifi_pcie=1); the link is not up
	status      battery     missing   not in this configuration (the UEFI charger-state path is untried here); the level through the audio DSP needs the DSP fully up
	status      gpu         missing   Adreno 830: nothing brought up
	status      storage     missing   UFS not brought up; the kernel runs from RAM
	status      camera      missing
	status      haptic      missing
	status      bluetooth   missing
	status      cellular    missing   the modem is not started; soc.args carries the IPA's addresses for when it is
	status      network     missing
	status      thermal     missing
	status      sensors     missing
